spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/req_tracker
    username: postgres              # 替换为您本地数据库用户名
    password: 123     # 替换为您本地数据库密码
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update              # 自动检测并更新表结构，开发阶段非常实用
    show-sql: true                  # 在控制台打印 SQL 语句，方便调试
    properties:
      hibernate:
        format_sql: true            # 格式化打印的 SQL，使其清晰易读