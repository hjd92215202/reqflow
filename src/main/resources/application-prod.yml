spring:
  datasource:
    # 核心优化：全部采用环境变量注入，并提供默认后备值，彻底解耦代码与部署环境
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/req_tracker_prod}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Flyway 管理版本化迁移，生产环境由 Hibernate 校验结构，禁止自动改表
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true       # 生产环境平滑接入
    baseline-version: 1.0.0
    locations: classpath:db/migration
