spring:
  datasource:
    # 核心优化：全部采用环境变量注入，并提供默认后备值，彻底解耦代码与部署环境
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/req_tracker_prod}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # 生产环境强烈建议设为 update（配合首次建表）或 validate，此处设为 update 方便小白用户一键拉起无需手动跑 sql
      ddl-auto: update
    show-sql: false